# Rule_for_self: OpenClash native YAML overwrite module.
# Install as /etc/openclash/overwrite/Rule_for_self.yaml and enable the module.
# This is an OpenClash module, not a standalone Mihomo configuration.
# Disable /etc/openclash/custom/openclash_custom_overwrite.sh when using it.
# Preserve subscription nodes/providers and all oc-* rule providers.
# The negative lookahead below is evaluated by Ruby, not Mihomo node filters.
# Keep rule-providers* BEFORE rule-providers: remove old sets, then add ours.
# Do not use dns!: unrelated generated DNS keys and fake-ip-filter must survive.
[YAML]
tun:
  mtu: 1492
ipv6: true
