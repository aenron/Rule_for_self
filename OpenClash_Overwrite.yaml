    - https://dns.google/dns-query
    rule-set:Nintendo:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    rule-set:Gmail:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    rule-set:CustomDirectDomain:
    - 223.5.5.5
    - 119.29.29.29
    rule-set:PrivateDomain:
    - 223.5.5.5
    - 119.29.29.29
    rule-set:ChinaDomain:
    - 223.5.5.5
    - 119.29.29.29
    rule-set:GoogleCN:
    - 223.5.5.5
    - 119.29.29.29
    rule-set:SteamCN:
    - 223.5.5.5
    - 119.29.29.29
  enable: true
  respect-rules: true
  prefer-h3: false
  ipv6: true
  cache-algorithm: arc
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - https://cloudflare-dns.com/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver-follow-policy: false
  fallback-filter!:
    geoip: true
    geoip-code: CN
    fallback-lazy-query: false
