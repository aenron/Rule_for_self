  nameserver-policy:
    rule-set:CustomProxyDomain:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    rule-set:AI:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    rule-set:GitHub:
